[Unit]
Requires=astral-brew-lock.service
After=astral-brew-lock.service
# brew-proxy replaces the brew symlink with an executable wrapper.
ConditionPathIsSymbolicLink=
ConditionFileIsExecutable=/home/linuxbrew/.linuxbrew/bin/brew

[Service]
# Use the owner of the shared installation without interactive proxy auth.
User=linuxbrew
WorkingDirectory=/home/linuxbrew
Environment="PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
