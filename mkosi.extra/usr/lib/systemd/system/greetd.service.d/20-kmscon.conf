[Unit]
# This needs to be on the same TTY that greetd is ran off of. Check greetd.conf
Conflicts=kmsconvt@tty1.service
After=kmsconvt@tty1.service

[Service]
# Wait until other boot jobs finish so their console status lines do not flash
# over tty1 right as the greeter starts.
Type=idle
# Claim tty1 so systemd/kernel messages stop landing on the greeter VT.
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
TTYVTDisallocate=yes
StandardInput=tty
StandardOutput=journal
StandardError=journal
ExecStartPre=/usr/libexec/astral/prepare-greetd-vt hide
ExecStopPost=/usr/libexec/astral/prepare-greetd-vt show
