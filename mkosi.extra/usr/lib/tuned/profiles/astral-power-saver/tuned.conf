[main]
summary=Stock powersave with a low CPU package power limit
include=powersave

# ponytail: StarBook calibration knobs, see astral-balanced.
[rapl]
type=sysfs
cpuinfo_regex=Core\(TM\) Ultra 7 165H
/sys/class/powercap/intel-rapl:0/constraint_0_power_limit_uw=15000000
/sys/class/powercap/intel-rapl:0/constraint_1_power_limit_uw=25000000
