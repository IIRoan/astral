[main]
summary=Stock balanced with a cooler sustained CPU package power limit
include=balanced

# Package power limits are the lever that tracks temperature; turbo and EPP
# switches only shift where heat appears. Only the StarBook's CPU is matched,
# so other machines keep their firmware limits.
# ponytail: StarBook calibration knobs. Measured all-core steady state with Fan
# Mode Normal: 15 W -> 83 C; 28 W and 38 W both pin at the 100 C TCC limit
# (the cooler saturates below 28 W). Lower PL1 for cooler sustained loads, PL2 for bursts.
# Light loads (Zeron, niri) boost single P-cores toward 5 GHz, which is where
# near-idle heat comes from: at ~4% CPU, balanced ran 90 C with 101 C spikes
# vs 74 C in powersave. Cap boost rather than disabling it (turbo off drops the
# P-cores to their 1.4 GHz base and feels sluggish).
# ponytail: calibration knob, percent of each core's max turbo clock.
[cpu]
max_perf_pct=75

[rapl]
type=sysfs
cpuinfo_regex=Core\(TM\) Ultra 7 165H
/sys/class/powercap/intel-rapl:0/constraint_0_power_limit_uw=20000000
/sys/class/powercap/intel-rapl:0/constraint_1_power_limit_uw=55000000
