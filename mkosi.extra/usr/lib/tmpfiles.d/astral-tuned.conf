# tuned_ppd_t cannot read tuned_etc_t symlinks on Fedora 45. Use a regular
# configuration file and preserve administrator changes to that file.
C /etc/tuned/ppd.conf 0644 root root - /usr/share/astral/tuned/ppd.conf
# Fedora 44 could leave these logs with generic var_log_t labels while the
# tuned-ppd domain was permissive. Restore the current policy's log labels.
Z /var/log/tuned - - - -
