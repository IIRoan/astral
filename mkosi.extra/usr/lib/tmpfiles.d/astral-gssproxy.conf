# StateDirectory cannot create these children under gssproxy_var_lib_t with
# the enforcing policy. Create and label them before the daemon starts.
d /var/lib/gssproxy 0755 root root -
d /var/lib/gssproxy/clients 0700 root root -
d /var/lib/gssproxy/rcache 0700 root root -
Z /var/lib/gssproxy - - - -
