L+ /etc/taidan.toml
L+ /etc/greetd/config.toml
d /etc/security/pwquality.conf.d 0755 root root -
L+ /etc/security/pwquality.conf.d/99-astral-password-policy.conf
d /etc/niri 0755 root root -
L+ /etc/niri/config.kdl
# TuneD owns CPU power limits; mask inherited Bluefin power scripts that fight it.
L+ /etc/systemd/system/power-profile-sync.path - - - - /dev/null
L+ /etc/systemd/system/power-profile-sync.service - - - - /dev/null
L+ /etc/systemd/system/cpu-cooling.service - - - - /dev/null
d /var/lib/greetd 0750 greeter greeter -
d /var/lib/greetd/.local 0700 greeter greeter -
d /var/lib/greetd/.local/share 0700 greeter greeter -
d /var/lib/greetd/.local/share/keyrings 0700 greeter greeter -
d /var/lib/noctalia-greeter 0750 greeter greeter -
C+ /var/lib/noctalia-greeter/greeter.toml 0640 greeter greeter - /usr/share/astral/noctalia-greeter.toml
Z /var/lib/noctalia-greeter - - - -
L /etc/profile.d/fcitx5.sh
L /etc/profile.d/afetch.sh
L /etc/profile.d/afunny.sh
L /etc/profile.d/astral-font-settings.sh
L /etc/profile.d/astral-podman-docker.sh
L /etc/profile.d/amotd.sh
L /etc/profile.d/aprompt.sh
L /etc/kmscon/kmscon.conf
