# Hide kernel/systemd console noise and enable Plymouth's graphical splash.
# rhgb is Fedora's traditional splash flag (equivalent to splash elsewhere).
kargs = [
    "quiet",
    "rhgb",
    "loglevel=3",
    "systemd.show_status=auto",
    "rd.udev.log_level=3",
    "vt.global_cursor_default=0",
    "plymouth.use-simpledrm",
]
