# Silence console spam that blanks the firmware logo (deferred takeover) and
# flashes text between boot and the noctalia greeter. Intentionally no rhgb /
# Plymouth splash — keep the OEM/hardware logo until the greeter takes over.
kargs = [
    "quiet",
    "loglevel=3",
    "systemd.show_status=auto",
    "rd.udev.log_level=3",
    "vt.global_cursor_default=0",
]
