---
name: Build Astral ISO
on:
  workflow_dispatch:

jobs:
  build_release:
    name: Build AMD64 ISO
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "64G"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build ISO
        id: build-iso
        env:
          TARGET_IMAGE: ghcr.io/iiroan/astral:latest
          TARGET_CONFIG: ./iso.toml
        run: |
          sudo podman pull "${TARGET_IMAGE}"
          sudo mkdir -p rpm-gpg output
          sudo podman run --rm -it -v ./rpm-gpg:/out:Z "${TARGET_IMAGE}" bash -c 'cp /etc/pki/rpm-gpg/* /out'
          # bootc-image-builder keys off os-release ID, not ID_LIKE. Current
          # images still advertise ID=astral, so map that onto Fedora's defs.
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            --entrypoint /bin/sh \
            -e TARGET_IMAGE \
            -v "${TARGET_CONFIG}:/config.toml:ro" \
            -v ./output/:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ./rpm-gpg/:/etc/pki/rpm-gpg/:ro \
            quay.io/centos-bootc/bootc-image-builder:latest \
            -c 'set -eu
              DEFS=""
              for d in /usr/share/bootc-image-builder/defs /usr/share/image-builder/defs; do
                if [ -d "$d" ]; then DEFS="$d"; break; fi
              done
              if [ -z "$DEFS" ]; then
                echo "Could not find bootc-image-builder distro defs" >&2
                exit 1
              fi
              FEDORA_DEF=$(ls -1 "$DEFS"/fedora-*.yaml | sort -V | tail -n1)
              echo "Mapping astral distro defs to $(basename "$FEDORA_DEF")"
              for f in "$DEFS"/fedora-*.yaml; do
                ln -sfn "$(basename "$f")" "$DEFS/$(basename "$f" | sed "s/^fedora-/astral-/")"
              done
              ln -sfn "$(basename "$FEDORA_DEF")" "$DEFS/astral-44.yaml"
              ls -l "$DEFS"/astral-*.yaml "$FEDORA_DEF"
              exec /usr/bin/bootc-image-builder --type iso --rootfs btrfs --use-librepo=True "$TARGET_IMAGE"'
          echo "output-directory=$(realpath ./output)" >> $GITHUB_OUTPUT

      - name: Brand ISOs
        env:
          SOURCE_DIR: ${{ steps.build-iso.outputs.output-directory }}
        run: |
          sudo mv "${SOURCE_DIR}"/*/*.iso "${SOURCE_DIR}/astral-unbranded.iso"
          sudo podman rmi -a -f
          podman rmi -a -f
          sudo podman run \
            --rm \
            -it \
            --pull=newer \
            --privileged \
            -v /dev:/dev \
            -v "${SOURCE_DIR}:/output" \
            -v ./assets/iso:/iso \
            registry.fedoraproject.org/fedora:latest \
            bash -c 'dnf install -y lorax \
            && mkdir /images \
            && cd /iso/product && find . | cpio -c -o | gzip -9cv > /images/product.img && cd / \
            && mkksiso \
                --add /images \
                --volid astral-boot \
                --replace "vmlinuz" "vmlinuz inst.resolution=1280x800" \
                /output/astral-unbranded.iso \
                /output/astral.iso'
          sudo mv "${SOURCE_DIR}"/astral.iso "${SOURCE_DIR}/astral-amd64.iso"
          (cd "${SOURCE_DIR}" && sha256sum astral-amd64.iso | sudo tee astral-amd64.iso-CHECKSUM)
          sudo rm -f "${SOURCE_DIR}/astral-unbranded.iso"

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: astral-amd64
          path: |
            ${{ steps.build-iso.outputs.output-directory }}/astral-amd64.iso
            ${{ steps.build-iso.outputs.output-directory }}/astral-amd64.iso-CHECKSUM
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
