---
name: Build Image
on:
  workflow_call:
    inputs:
      image-name:
        description: "The name of the image to build"
        required: true
        type: string
      image-desc:
        description: "The description of the image to build"
        required: false
        type: string
      default-tag:
        description: "Default tag to push to"
        required: false
        type: string
        default: "latest"
      platforms:
        description: "The platforms to build the image for"
        required: false
        type: string
        default: "amd64,arm64"
      publish:
        description: "Publish this image"
        required: false
        type: boolean
        default: true
      candidate:
        description: Publish only isolated candidate tags during a manual run
        required: false
        type: boolean
        default: false
      profiles:
        description: "Extra mkosi profiles to use"
        required: false
        type: string
        default: ""
      release:
        description: "Release to build for"
        required: false
        type: string
    secrets:
      SIGNING_SECRET:
        description: "The private key used to sign the image"
        required: false
    outputs:
      digest:
        description: Verified multi-architecture image digest
        value: ${{ jobs.manifest.outputs.digest }}

env:
  DEFAULT_TAG: "${{ inputs.default-tag }}"
  IMAGE_DESC: "Opinionated niri + bootc image"
  IMAGE_KEYWORDS: "bootc,niri"
  IMAGE_LICENSE: AGPL-3.0-or-later
  IMAGE_LOGO_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/assets/logos/logo-astral.svg"
  IMAGE_NAME: "${{ inputs.image-name }}"
  IMAGE_REGISTRY: "ghcr.io/iiroan"

jobs:
  generate_matrix:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      distribution_version: ${{ steps.imagemetadata.outputs.distributionversion }}
      image_version: ${{ steps.imagemetadata.outputs.imageversion }}
      image_created: ${{ steps.imagemetadata.outputs.imagecreated }}
    steps:
      - name: Validate publishing context
        env:
          PUBLISH_IMAGE: ${{ inputs.publish }}
          CANDIDATE_IMAGE: ${{ inputs.candidate }}
          IMAGE_TAG: ${{ inputs.default-tag }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_IMAGE" != true ]]; then
            exit 0
          fi
          if [[ "$CANDIDATE_IMAGE" == true ]]; then
            [[ "$EVENT_NAME" == workflow_dispatch ]]
            [[ "$SOURCE_REF" == refs/heads/* ]]
            [[ "$IMAGE_TAG" == "candidate-${RUN_ID}-${RUN_ATTEMPT}" ]]
          else
            [[ "$SOURCE_REF" == "refs/heads/${DEFAULT_BRANCH}" ]]
            [[ "$EVENT_NAME" == push || "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]
          fi

      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Get mkosi metadata
        id: imagemetadata
        env:
          MANUAL_RELEASE: ${{ inputs.release }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$MANUAL_RELEASE" != "" ] ; then
            distribution_version="$MANUAL_RELEASE"
          else
            distribution_version="$(grep '^Release=' mkosi.conf | cut -d= -f2-)"
          fi
          [[ "$distribution_version" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          image_version="${distribution_version}.${RUN_ID}.${RUN_ATTEMPT}"
          image_created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'distributionversion=%s\nimageversion=%s\nimagecreated=%s\n' \
            "$distribution_version" "$image_version" "$image_created" >> "$GITHUB_OUTPUT"

      - name: Set matrix
        id: set-matrix
        env:
          PLATFORMS: "${{ inputs.platforms }}"
        run: |
          MATRIX="{\"include\":[]}"
          for platform in $(tr ',' ' ' <<< "${PLATFORMS}") ; do
            MATRIX="$(jq -c ".include += [{\"platform\": \"${platform}\"}]" <<< "${MATRIX}")"
          done
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build_push:
    name: Build and push image
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    needs: generate_matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install mkosi
        uses: ./.github/actions/setup-mkosi

      - name: Install just
        uses: chainguard-actions/extractions-setup-just@38218e009000cd406ac24efa9ec66d37f202dd66 # v4

      - name: Render configuration (for debugging)
        run: mkosi cat-config --debug

      - name: Build image
        id: build
        env:
          CI_MKOSI_PROFILES: ${{ inputs.profiles }}
          CI_MKOSI_RELEASE: ${{ inputs.release }}
          CI_IMAGE_VERSION: ${{ needs.generate_matrix.outputs.image_version }}
          CI_IMAGE_CREATED: ${{ needs.generate_matrix.outputs.image_created }}
          IMAGE_FULL: localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RELEASE_ARGUMENTS=()
          if [ "$CI_MKOSI_RELEASE" != "" ] ; then
            RELEASE_ARGUMENTS+=("--release=$CI_MKOSI_RELEASE")
          fi
          sudo mkosi -B -ff --debug "--profile=base,base-desktop,bootc-ostree,brew,astral-bootc-ostree${CI_MKOSI_PROFILES:+,${CI_MKOSI_PROFILES}}" \
            "${RELEASE_ARGUMENTS[@]}" "--environment=GITHUB_TOKEN=${GITHUB_TOKEN}" \
            "--image-version=${CI_IMAGE_VERSION}" \
            "--oci-labels=org.opencontainers.image.version=${CI_IMAGE_VERSION} org.opencontainers.image.created=${CI_IMAGE_CREATED}"

      - name: Load image
        id: load
        run: |
          set -e
          env IMAGE_FULL="localhost/${IMAGE_NAME}:${DEFAULT_TAG}" just load

      - name: Rechunk image
        run: |
          set -e
          env IMAGE_FULL="localhost/${IMAGE_NAME}:${DEFAULT_TAG}" just rechunk

      - name: Lint image
        run: |
          set -e
          env IMAGE_FULL="localhost/${IMAGE_NAME}:${DEFAULT_TAG}" just lint

      - name: Check installation metadata on the native image
        env:
          EXPECTED_VERSION: ${{ needs.generate_matrix.outputs.image_version }}
          EXPECTED_CREATED: ${{ needs.generate_matrix.outputs.image_created }}
        run: |
          set -euo pipefail
          image="localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          test "$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.version" }}' "$image")" = "$EXPECTED_VERSION"
          test "$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.created" }}' "$image")" = "$EXPECTED_CREATED"
          test "$(podman image inspect --format '{{ index .Labels "containers.bootc" }}' "$image")" = 1

      - name: Check Flatpak updates in the built image
        run: |
          podman run --rm -i --entrypoint=/usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < tests/check-flatpak-update

      - name: Check Fedora upgrade compatibility in the built image
        run: |
          podman run --rm --privileged -i --entrypoint=/usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" < tests/check-fedora-upgrade

      - name: Check TPM recovery with the built Fedora encryption tools
        run: |
          podman run --rm --privileged -i --entrypoint=/usr/bin/bash \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c \
            'dnf5 install -y --setopt=install_weak_deps=False swtpm tpm2-tools </dev/null && exec python3 -' \
            < tests/check-tpm-policy

      - name: Login to GitHub Container Registry
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN_USER: ${{ github.actor }}
        run: echo "${GITHUB_TOKEN}" | podman login -u "${LOGIN_USER}" --password-stdin "ghcr.io"

      - name: Push to GHCR
        if: inputs.publish
        id: push
        env:
          IMAGE_DIGEST: ${{ steps.load.outputs.digest }}
          MAX_RETRIES: 3
          PLATFORM: ${{ matrix.platform }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          : "${SIGNING_SECRET:?SIGNING_SECRET must be configured when publishing}"
          sudo install -d -m 0755 "/etc/containers/registries.d/"
          printf 'docker:\n  %s:\n    use-sigstore-attachments: true\n' "${IMAGE_REGISTRY}" | sudo tee "/etc/containers/registries.d/${REPOSITORY_OWNER}.yaml" > /dev/null
          sudo chmod 0644 "/etc/containers/registries.d/${REPOSITORY_OWNER}.yaml"

          umask 077
          PRIVATE_KEY_FILE="$(mktemp)"
          printf '%s\n' "${SIGNING_SECRET}" > "${PRIVATE_KEY_FILE}"
          trap 'rm -f "${PRIVATE_KEY_FILE}"' EXIT

          DIGESTFILE="/tmp/digestfile" # This needs to be r/w, non-existent so that podman can write to it
          # HACK: push two times so layer annotations are present
          # TODO: remove me when https://github.com/containers/podman/issues/27796 fixed
          for _ in $(seq 2); do
            podman push --retry "${MAX_RETRIES}" --compression-format=zstd --digestfile="${DIGESTFILE}" "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${PLATFORM}" "--sign-passphrase-file=/dev/null" "--sign-by-sigstore-private-key=${PRIVATE_KEY_FILE}"
          done
          echo "remote_image_digest=$(< "${DIGESTFILE}")" | tee "${GITHUB_OUTPUT}"

      - name: Create Job Outputs
        if: inputs.publish
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.push.outputs.remote_image_digest }}
        run: |
          set -x
          mkdir -p /tmp/outputs/digests
          echo "${DIGEST}" | tee "/tmp/outputs/digests/${IMAGE_NAME}-${PLATFORM}.txt"

      - name: Upload Output Artifacts
        if: inputs.publish
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: ${{ env.IMAGE_NAME }}-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/outputs/digests/*.txt

  manifest:
    name: Create Manifest
    runs-on: ubuntu-26.04
    if: always()
    needs:
      - build_push
      - generate_matrix
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Exit on failure
        shell: bash
        env:
          JOBS: ${{ toJson(needs) }}
        run: |
          for i in $(jq -r 'to_entries[] | .value.result' <<< "${JOBS}"); do
            if [ "$i" != "success" ] && [ "$i" != "skipped" ]; then
              echo "Status check not okay!"
              exit 1
            fi
          done

      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Image Metadata
        uses: chainguard-actions/docker-metadata-action@f00cce7d85a292451bbab8346cddfdfb3a7b0ea4 # v6.2.0
        if: inputs.publish
        id: metadata
        with:
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ needs.generate_matrix.outputs.distribution_version }},enable=${{ ! inputs.candidate }}
            type=raw,value=${{ env.DEFAULT_TAG }}-${{ github.sha }}
            type=raw,value=${{ needs.generate_matrix.outputs.distribution_version }}-${{ github.sha }},enable=${{ ! inputs.candidate }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}},enable=${{ ! inputs.candidate }}
            type=raw,value=${{ needs.generate_matrix.outputs.distribution_version }}.{{date 'YYYYMMDD'}},enable=${{ ! inputs.candidate }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}-${{ github.sha }},enable=${{ ! inputs.candidate }}
            type=raw,value=${{ needs.generate_matrix.outputs.distribution_version }}.{{date 'YYYYMMDD'}}-${{ github.sha }},enable=${{ ! inputs.candidate }}
            type=raw,value={{ date 'YYYYMMDD'}},enable=${{ ! inputs.candidate && env.DEFAULT_TAG == 'latest' }}
            type=ref,event=pr,enable=${{ ! inputs.candidate }}
            type=sha,enable=${{ ! inputs.candidate && github.event_name == 'pull_request' }}
          labels: |
            containers.bootc=1
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=${{ env.IMAGE_LICENSE }}
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=${{ inputs.candidate }}
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ needs.generate_matrix.outputs.image_created }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.licenses=${{ env.IMAGE_LICENSE }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ needs.generate_matrix.outputs.image_version }}

      - name: Login to GitHub Container Registry
        if: inputs.publish
        env:
          REGISTRY: ghcr.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | podman login -u "${GITHUB_ACTOR}" --password-stdin "${REGISTRY}"
          echo "${GITHUB_TOKEN}" | docker login -u "${GITHUB_ACTOR}" --password-stdin "${REGISTRY}"

      - name: Fetch Build Outputs
        if: inputs.publish
        uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          pattern: ${{ env.IMAGE_NAME }}-*
          merge-multiple: true
          path: /tmp/artifacts

      - name: Publish manifest with unified architecture and sign
        id: publish
        shell: bash
        if: inputs.publish
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          LABELS: ${{ steps.metadata.outputs.labels }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          CANDIDATE_IMAGE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          : "${SIGNING_SECRET:?SIGNING_SECRET must be configured when publishing}"
          if [[ "$CANDIDATE_IMAGE" == true ]]; then
            while IFS= read -r TAG; do
              [[ "$TAG" == "$DEFAULT_TAG" || "$TAG" == "${DEFAULT_TAG}-${GITHUB_SHA}" ]]
            done <<< "$TAGS"
          fi
          sudo install -d -m 0755 "/etc/containers/registries.d/"
          printf 'docker:\n  %s:\n    use-sigstore-attachments: true\n' "${IMAGE_REGISTRY}" | sudo tee "/etc/containers/registries.d/${REPOSITORY_OWNER}.yaml" > /dev/null
          sudo chmod 0644 "/etc/containers/registries.d/${REPOSITORY_OWNER}.yaml"

          umask 077

          PRIVATE_KEY_FILE="$(mktemp)"
          printf '%s\n' "${SIGNING_SECRET}" > "${PRIVATE_KEY_FILE}"
          trap 'rm -f "${PRIVATE_KEY_FILE}"' EXIT

          TARGET_MANIFEST="${IMAGE_REGISTRY}/${IMAGE_NAME}"

          for digest_file in /tmp/artifacts/*.txt; do
            # Extract the platform from the file name
            TARGET_PLATFORM="$(basename "${digest_file}" ".txt" | sed 's/.*-//g')"
            TARGET_DIGEST="$(< "${digest_file}")"

            if ! podman images | grep -F -e "${TARGET_MANIFEST}" ; then
              podman manifest create "${TARGET_MANIFEST}"
            fi

            podman manifest add "${TARGET_MANIFEST}" "${TARGET_MANIFEST}@${TARGET_DIGEST}" --arch "${TARGET_PLATFORM}"
          done

          # We want one per image instead
          for digest_file in $(find /tmp/artifacts/*.txt | cut -f1 -d- | uniq); do
            while IFS= read -r LABEL; do
              podman manifest annotate --index --annotation "${LABEL}" "${TARGET_MANIFEST}"
            done <<< "${LABELS}"
            # HACK: push two times so layer annotations are present
            # TODO: remove me when https://github.com/containers/podman/issues/27796 fixed
            for _ in $(seq 2); do
              while IFS= read -r TAG; do
                DIGEST_ARGUMENT=()
                if [ "${TAG}" = "${DEFAULT_TAG}" ]; then
                  rm -f /tmp/manifest-digest
                  DIGEST_ARGUMENT+=(--digestfile=/tmp/manifest-digest)
                fi
                podman manifest push --all=false --compression-format=zstd "${DIGEST_ARGUMENT[@]}" "${TARGET_MANIFEST}" "${TARGET_MANIFEST}:${TAG}" "--sign-passphrase-file=/dev/null" "--sign-by-sigstore-private-key=${PRIVATE_KEY_FILE}"
              done <<< "${TAGS}"
            done
          done

          test -s /tmp/manifest-digest
          echo "digest=$(< /tmp/manifest-digest)" >> "${GITHUB_OUTPUT}"

      - name: Attest image provenance
        if: inputs.publish
        uses: chainguard-actions/actions-attest@fd7c311a2ded9db8e69c205f3442b52a1547b2f9 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: false
          create-storage-record: false

  verify:
    name: Verify published image
    runs-on: ubuntu-26.04
    if: ${{ inputs.publish }}
    needs:
      - manifest
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Install Cosign
        uses: chainguard-actions/sigstore-cosign-installer@b87981cc3b0232e11827d1a8c6bcfa63d6cbd97a # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Login to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: echo "${GITHUB_TOKEN}" | docker login -u "${GITHUB_ACTOR}" --password-stdin ghcr.io

      - name: Verify Sigstore signature and provenance
        env:
          DIGEST: ${{ needs.manifest.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${DIGEST:?published digest missing}"
          IMAGE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

          # Podman private-key Sigstore signatures are not Rekor-logged.
          # This still verifies the signature against the vendored astral.pub key.
          cosign verify \
            --key astral.pub \
            --insecure-ignore-tlog=true \
            "${IMAGE_REF}"

          # The index and every native image must carry Astral's signature.
          docker manifest inspect "$IMAGE_REF" > /tmp/published-index.json
          for architecture in amd64 arm64; do
            child_digest="$(jq -er --arg arch "$architecture" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("missing or duplicate architecture") end' /tmp/published-index.json)"
            cosign verify --key astral.pub --insecure-ignore-tlog=true \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}@${child_digest}"
          done

          gh attestation verify "oci://${IMAGE_REF}" --repo "${GITHUB_REPOSITORY}" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --signer-digest "$GITHUB_SHA" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/reusable-build-bootc.yaml" \
            --deny-self-hosted-runners
