name: Build Astral

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 1 * * *"
  merge_group:
  workflow_dispatch:
    inputs:
      candidate:
        description: Publish and verify an isolated release candidate (does not update latest)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  keepalive:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && ! inputs.candidate
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Keep scheduled image builds active during repository inactivity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/build-standard-bootc.yaml/enable"

  validate:
    name: Maintenance checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      - name: Check update and recovery behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check greeter authorization boundaries
        run: node --test tests/test_greeter_policy.cjs
      - name: Check maintenance and build shell scripts
        run: |
          shellcheck mkosi.extra/usr/bin/luks-tpm2-autounlock \
            mkosi.extra/usr/libexec/astral/{update-health,update-user-setup,firmware-update-check,composefs-remount,sync-noctalia-greeter,prepare-tuned-ppd} \
            mkosi.profiles/brew/mkosi.extra/usr/libexec/astral/{brew-locked,install-brew-lock} \
            build-scripts/ensure-tool mkosi.profiles/{brew,jackrabbit}/mkosi.prepare.chroot \
            tests/check-flatpak-update tests/check-fedora-upgrade

  validate_tpm:
    name: TPM policy and recovery checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      - name: Install software TPM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            swtpm tpm2-tools libtss2-tcti-swtpm0t64 cryptsetup-bin systemd-cryptsetup
      - name: Verify migration, PCR rejection, and recovery on a disposable image
        run: sudo python3 tests/check-tpm-policy

  build:
    needs: [validate, validate_tpm]
    uses: ./.github/workflows/reusable-build-bootc.yaml
    secrets: inherit
    with:
      image-name: astral
      platforms: amd64,arm64
      candidate: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate }}
      default-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate && format('candidate-{0}-{1}', github.run_id, github.run_attempt) || 'latest' }}
      publish: ${{ (github.event_name == 'workflow_dispatch' && inputs.candidate) || (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}

  image_checks:
    name: Image checks
    if: always()
    needs: [validate, validate_tpm, build, keepalive]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Require maintenance, TPM recovery, and both image builds to succeed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          TPM_RESULT: ${{ needs.validate_tpm.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          KEEPALIVE_RESULT: ${{ needs.keepalive.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$TPM_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$KEEPALIVE_RESULT" = success || test "$KEEPALIVE_RESULT" = skipped

  report:
    if: >-
      always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name != 'pull_request' && github.event_name != 'merge_group' && ! inputs.candidate
    needs: [image_checks]
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Track failed automatic builds until they recover
        uses: chainguard-actions/actions-github-script@5ae8e66bc55d3cfc641b4dd912088e3996b815c2 # v9.0.0
        env:
          BUILD_RESULT: ${{ needs.image_checks.result }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const title = 'Automatic Astral image updates are failing';
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open'});
            const issue = issues.find(i => i.title === title && i.user.login === 'github-actions[bot]');
            if (process.env.BUILD_RESULT === 'success') {
              if (issue) await github.rest.issues.update({owner, repo, issue_number: issue.number, state: 'closed'});
              return;
            }
            const body = `The image build or its verification failed. Machines cannot receive a new image until this recovers.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\nThis issue closes automatically after a successful build.`;
            if (issue) await github.rest.issues.update({owner, repo, issue_number: issue.number, body});
            else await github.rest.issues.create({owner, repo, title, body});
