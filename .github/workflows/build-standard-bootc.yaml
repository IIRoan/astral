name: Build Astral

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 1 * * *"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Keep scheduled image builds active during repository inactivity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/build-standard-bootc.yaml/enable"

  validate:
    name: Maintenance checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check update and recovery behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check maintenance shell scripts
        run: |
          shellcheck mkosi.extra/usr/libexec/astral/{update-health,update-user-setup,firmware-update-check,composefs-remount} \
            mkosi.profiles/brew/mkosi.extra/usr/libexec/astral/{brew-locked,install-brew-lock}

  build:
    needs: validate
    uses: ./.github/workflows/reusable-build-bootc.yaml
    secrets: inherit
    with:
      image-name: astral
      platforms: amd64,arm64
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

  image_checks:
    name: Image checks
    if: always()
    needs: [validate, build]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Require maintenance checks and both image builds to succeed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$VALIDATE_RESULT" = success && test "$BUILD_RESULT" = success

  report:
    if: >-
      always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name != 'pull_request' && github.event_name != 'merge_group'
    needs: [image_checks]
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Track failed automatic builds until they recover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RESULT: ${{ needs.image_checks.result }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const title = 'Automatic Astral image updates are failing';
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open'});
            const issue = issues.find(i => i.title === title && i.user.login === 'github-actions[bot]');
            if (process.env.BUILD_RESULT === 'success') {
              if (issue) await github.rest.issues.update({owner, repo, issue_number: issue.number, state: 'closed'});
              return;
            }
            const body = `The image build or its verification failed. Machines cannot receive a new image until this recovers.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\nThis issue closes automatically after a successful build.`;
            if (issue) await github.rest.issues.update({owner, repo, issue_number: issue.number, body});
            else await github.rest.issues.create({owner, repo, title, body});
