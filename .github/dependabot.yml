version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/free-disk-space
      - /.github/actions/setup-mkosi
    schedule:
      interval: daily
      time: "06:17"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      actions:
        update-types:
          - minor
          - patch
